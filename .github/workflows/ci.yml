name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so the build must run with the real production values.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next
            public
          retention-days: 7

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Non-blocking for now: 9 no-explicit-any errors outstanding. Once those are
    # typed, drop this flag so lint becomes a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx eslint .
